<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kivo — Início</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#400056" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1 id="titulo">Bem-vindo(a)</h1>
    <p class="subtitulo" id="subtitulo"></p>
    <div class="cartoes-resumo" id="cartoes"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    const auth = exigirLogin();
    if (auth) {
      montarTopo("topo");
      document.getElementById("titulo").textContent = `Olá, ${auth.nome}`;

      const cartoesPorPapel = {
        super_admin: [
          { href: "/pages/empresas.html", titulo: "Empresas", desc: "Cadastrar e gerenciar empresas na plataforma" },
          { href: "/pages/planos.html", titulo: "Planos", desc: "Planos de assinatura oferecidos às empresas" },
          { href: "/pages/plataforma.html", titulo: "Plataforma", desc: "MRR, assinaturas e empresas perto do limite" },
        ],
        admin_empresa: [
          { href: "/pages/funcionarios.html", titulo: "Funcionários", desc: "Gerencie a equipe da sua empresa" },
          { href: "/pages/parceiros.html", titulo: "Parceiros", desc: "Agências/vendedores que vendem passagem ou despacham frete pra você", modulo: ["passagens", "frete"] },
          { href: "/pages/onibus.html", titulo: "Ônibus", desc: "Cadastre veículos e o layout de poltronas", modulo: ["passagens", "fretamento"] },
          { href: "/pages/motoristas.html", titulo: "Motoristas", desc: "Cadastre motoristas pra vincular em viagens, fretamentos e fretes", modulo: "motorista" },
          { href: "/pages/rotas.html", titulo: "Rotas", desc: "Origens e destinos atendidos", modulo: "passagens" },
          { href: "/pages/viagens.html", titulo: "Viagens", desc: "Crie viagens, venda passagens e gerencie poltronas", modulo: "passagens" },
          { href: "/pages/cupons.html", titulo: "Cupons", desc: "Cupons de desconto pra compra de passagem", modulo: "passagens" },
          { href: "/pages/fretamentos.html", titulo: "Fretamentos", desc: "Aluguel de ônibus com preço por km e rastreio ao vivo", modulo: "fretamento" },
          { href: "/pages/fretes.html", titulo: "Fretes", desc: "Envio de encomendas com rastreio ao vivo", modulo: "frete" },
          { href: "/pages/checkin.html", titulo: "Check-in", desc: "Confirme embarque pelo código da passagem", modulo: "passagens" },
          { href: "/pages/locais.html", titulo: "Locais", desc: "Teatros, cinemas, estádios e outros espaços com lugar marcado", modulo: "eventos" },
          { href: "/pages/sessoes.html", titulo: "Sessões", desc: "Crie sessões de evento e venda ingressos", modulo: "eventos" },
          { href: "/pages/checkin-eventos.html", titulo: "Check-in eventos", desc: "Confirme entrada pelo código do ingresso", modulo: "eventos" },
          { href: "/pages/turmas.html", titulo: "Turmas", desc: "Aulas recorrentes com vaga limitada (spinning, pilates, crossfit)", modulo: "academia" },
          { href: "/pages/ocorrencias-turma.html", titulo: "Agenda", desc: "Próximas ocorrências das turmas", modulo: "academia" },
          { href: "/pages/matriculas.html", titulo: "Matrículas", desc: "Matricule alunos e acompanhe mensalidades", modulo: "academia" },
          { href: "/pages/checkin-academia.html", titulo: "Check-in academia", desc: "Confirme presença do aluno na aula", modulo: "academia" },
          { href: "/pages/relatorios.html", titulo: "Relatórios", desc: "Ocupação, vendas e desempenho da equipe", modulo: ["passagens", "eventos", "academia"] },
          { href: "/pages/dre.html", titulo: "DRE", desc: "Receita líquida do período: passagens, fretamento e frete", modulo: "dre" },
          { href: "/pages/avaliacoes.html", titulo: "Avaliações", desc: "O que os clientes acharam das viagens e fretamentos", modulo: ["passagens", "fretamento"] },
          { href: "/pages/minhas-faturas.html", titulo: "Faturas", desc: "Cobranças da assinatura do Kivo" },
        ],
        funcionario: [
          { href: "/pages/viagens.html", titulo: "Viagens", desc: "Venda passagens e gerencie o mapa de poltronas", modulo: "passagens" },
          { href: "/pages/fretamentos.html", titulo: "Fretamentos", desc: "Gerencie fretamentos e compartilhe localização", modulo: "fretamento" },
          { href: "/pages/fretes.html", titulo: "Fretes", desc: "Gerencie fretes e compartilhe localização", modulo: "frete" },
          { href: "/pages/checkin.html", titulo: "Check-in", desc: "Confirme embarque pelo código da passagem", modulo: "passagens" },
          { href: "/pages/locais.html", titulo: "Locais", desc: "Teatros, cinemas, estádios e outros espaços com lugar marcado", modulo: "eventos" },
          { href: "/pages/sessoes.html", titulo: "Sessões", desc: "Crie sessões de evento e venda ingressos", modulo: "eventos" },
          { href: "/pages/checkin-eventos.html", titulo: "Check-in eventos", desc: "Confirme entrada pelo código do ingresso", modulo: "eventos" },
          { href: "/pages/turmas.html", titulo: "Turmas", desc: "Aulas recorrentes com vaga limitada (spinning, pilates, crossfit)", modulo: "academia" },
          { href: "/pages/ocorrencias-turma.html", titulo: "Agenda", desc: "Próximas ocorrências das turmas", modulo: "academia" },
          { href: "/pages/matriculas.html", titulo: "Matrículas", desc: "Matricule alunos e acompanhe mensalidades", modulo: "academia" },
          { href: "/pages/checkin-academia.html", titulo: "Check-in academia", desc: "Confirme presença do aluno na aula", modulo: "academia" },
          { href: "/pages/avaliacoes.html", titulo: "Avaliações", desc: "O que os clientes acharam das viagens e fretamentos", modulo: ["passagens", "fretamento"] },
        ],
        cliente: [
          { href: "/pages/busca.html", titulo: "Buscar viagem", desc: "Encontre passagens disponíveis" },
          { href: "/pages/minhas-passagens.html", titulo: "Minhas passagens", desc: "Veja e cancele suas passagens" },
        ],
        parceiro: [
          { href: "/pages/parceiro-vendas.html", titulo: "Minhas vendas", desc: "Passagens vendidas, fretes despachados e comissão estimada" },
        ],
        motorista: [
          { href: "/pages/motorista-app.html", titulo: "Minha jornada", desc: "Suas viagens/fretamentos/fretes, jornada e checklist" },
        ],
      };

      const subtitulos = {
        super_admin: "Gerencie as empresas cadastradas na plataforma Kivo.",
        admin_empresa: "Gerencie sua empresa, frota, rotas e vendas.",
        funcionario: "Atenda seus clientes e venda passagens.",
        cliente: "Encontre e compre suas passagens.",
        parceiro: "Acompanhe suas vendas e comissão.",
        motorista: "Controle sua jornada e o checklist do veículo.",
      };
      document.getElementById("subtitulo").textContent = subtitulos[auth.role] || "";

      const cartoes = cartoesPorPapel[auth.role] || [];
      document.getElementById("cartoes").innerHTML = cartoes
        .map(
          (c) => `
        <a class="cartao-resumo" href="${c.href}"${c.modulo ? ` data-modulo="${Array.isArray(c.modulo) ? c.modulo.join(" ") : c.modulo}"` : ""}>
          <div class="titulo">${c.titulo}</div>
          <div class="desc">${c.desc}</div>
        </a>`
        )
        .join("");

      if (auth.role === "admin_empresa" || auth.role === "funcionario") {
        api("GET", "/empresas/minha")
          .then((empresa) => {
            const modulosHabilitados = {
              fretamento: empresa.fretamento_habilitado,
              passagens: empresa.passagens_habilitado,
              frete: empresa.frete_habilitado,
              motorista: empresa.motorista_habilitado,
              dre: empresa.dre_habilitado,
              eventos: empresa.eventos_habilitado,
              academia: empresa.academia_habilitado,
            };
            document.querySelectorAll("[data-modulo]").forEach((el) => {
              const modulosDoCartao = el.dataset.modulo.split(" ");
              const algumHabilitado = modulosDoCartao.some((m) => modulosHabilitados[m]);
              if (!algumHabilitado) el.classList.add("escondido");
            });
          })
          .catch(() => {});
      }
    }
  </script>
</body>
</html>
