<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Mapa de poltronas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#400056" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Mapa de poltronas</h1>
    <p class="subtitulo" id="subtitulo">Selecione uma poltrona livre para iniciar a venda.</p>

    <div id="alerta"></div>

    <div class="cartao escondido" id="cartao-trecho" style="max-width:520px">
      <label style="margin-bottom:8px">Vender para qual trecho da viagem?</label>
      <div class="grid-form">
        <div>
          <label for="select-origem-trecho" style="font-weight:400;font-size:.8rem">Embarque</label>
          <select id="select-origem-trecho"></select>
        </div>
        <div>
          <label for="select-destino-trecho" style="font-weight:400;font-size:.8rem">Desembarque</label>
          <select id="select-destino-trecho"></select>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start">
      <div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:400">
          <input type="checkbox" id="modo-bloqueio" style="width:auto" />
          Modo bloqueio administrativo (poltrona indisponível, manutenção, etc.)
        </label>

        <div class="mapa-onibus" id="mapa-onibus"></div>

        <div class="legenda">
          <span><i class="i-livre"></i>Livre</span>
          <span><i class="i-selecionada"></i>Selecionada</span>
          <span><i class="i-hold"></i>Em reserva (hold)</span>
          <span><i class="i-vendida"></i>Vendida</span>
          <span><i class="i-bloqueada"></i>Bloqueada</span>
        </div>
      </div>

      <div class="cartao escondido" id="cartao-venda" style="min-width:280px">
        <h2 style="margin-top:0">Vender poltrona <span id="numero-selecionada"></span></h2>
        <p class="rodape-form" style="text-align:left;margin-top:-8px" id="preco-selecionada"></p>
        <form id="form-venda">
          <div style="margin-bottom:12px">
            <label for="cliente-nome">Nome do passageiro</label>
            <input id="cliente-nome" required />
          </div>
          <div style="margin-bottom:12px">
            <label for="tipo-documento">Tipo de documento</label>
            <select id="tipo-documento">
              <option value="cpf">CPF</option>
              <option value="rg">RG</option>
              <option value="cnh">CNH</option>
              <option value="passaporte">Passaporte</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div style="margin-bottom:12px">
            <label for="cliente-documento">Número do documento</label>
            <input id="cliente-documento" required />
          </div>
          <div style="margin-bottom:12px">
            <label for="cliente-telefone">Telefone do passageiro (opcional)</label>
            <input id="cliente-telefone" type="tel" placeholder="(00) 00000-0000" />
          </div>
          <div style="margin-bottom:12px">
            <label for="categoria-passageiro">Categoria</label>
            <select id="categoria-passageiro">
              <option value="comum">Comum</option>
              <option value="idoso">Idoso</option>
              <option value="pcd">PCD</option>
              <option value="crianca_colo">Criança de colo</option>
            </select>
          </div>
          <div style="margin-bottom:12px">
            <label for="forma-pagamento">Forma de pagamento</label>
            <select id="forma-pagamento">
              <option value="dinheiro">Dinheiro</option>
              <option value="cartao">Cartão</option>
              <option value="pix">Pix</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div style="margin-bottom:12px">
            <label for="codigo-cupom">Cupom de desconto (opcional)</label>
            <input id="codigo-cupom" placeholder="Ex: PROMO10" style="text-transform:uppercase" />
          </div>
          <div style="margin-bottom:12px">
            <label for="parceiro-venda">Parceiro (opcional)</label>
            <select id="parceiro-venda">
              <option value="">Venda direta</option>
            </select>
          </div>
          <div class="linha-acoes">
            <button type="submit">Confirmar venda</button>
            <button type="button" class="secundario" id="btn-liberar">Liberar poltrona</button>
          </div>
        </form>
        <div id="area-pix" class="escondido"></div>
      </div>
    </div>

    <h2>Passagens vendidas</h2>
    <div class="cartao">
      <table>
        <thead><tr><th>Localizador</th><th>Passageiro</th><th>CPF</th><th>Trecho</th><th>Preço</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-passagens"></tbody>
      </table>
      <p class="vazio escondido" id="vazio-passagens">Nenhuma passagem vendida ainda.</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/pagamento-pix.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa", "funcionario");
    const params = new URLSearchParams(window.location.search);
    const viagemId = params.get("viagem_id");
    let poltronaSelecionadaId = null;
    let intervaloAtualizacao = null;
    let trechoOrigemId = null;
    let trechoDestinoId = null;

    if (!viagemId) {
      window.location.href = "/pages/viagens.html";
    }

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
      if (tipo === "sucesso") {
        setTimeout(() => (document.getElementById("alerta").innerHTML = ""), 4000);
      }
    }

    function queryTrecho() {
      if (!trechoOrigemId || !trechoDestinoId) return "";
      return `?origem_parada_id=${trechoOrigemId}&destino_parada_id=${trechoDestinoId}`;
    }

    async function carregarParadas() {
      const viagens = await api("GET", "/viagens");
      const viagem = viagens.find((v) => v.id == viagemId);
      if (!viagem) return;
      const paradas = [...viagem.rota.paradas].sort((a, b) => a.ordem - b.ordem);
      if (paradas.length <= 2) return;

      document.getElementById("cartao-trecho").classList.remove("escondido");
      const selectOrigem = document.getElementById("select-origem-trecho");
      const selectDestino = document.getElementById("select-destino-trecho");
      const opcoes = paradas.map((p) => `<option value="${p.id}">${p.nome}</option>`).join("");
      selectOrigem.innerHTML = opcoes;
      selectDestino.innerHTML = opcoes;
      selectOrigem.value = paradas[0].id;
      selectDestino.value = paradas[paradas.length - 1].id;
      trechoOrigemId = paradas[0].id;
      trechoDestinoId = paradas[paradas.length - 1].id;

      const aoMudarTrecho = () => {
        trechoOrigemId = parseInt(selectOrigem.value, 10);
        trechoDestinoId = parseInt(selectDestino.value, 10);
        esconderFormularioVenda();
        carregarMapa().catch((e) => mostrarAlerta(e.message));
      };
      selectOrigem.addEventListener("change", aoMudarTrecho);
      selectDestino.addEventListener("change", aoMudarTrecho);
    }

    function esconderFormularioVenda() {
      poltronaSelecionadaId = null;
      document.getElementById("cartao-venda").classList.add("escondido");
      document.getElementById("form-venda").reset();
    }

    async function carregarMapa() {
      const poltronas = await api("GET", `/viagens/${viagemId}/poltronas${queryTrecho()}`);
      const porFileira = {};
      poltronas.forEach((p) => {
        porFileira[p.fileira] = porFileira[p.fileira] || [];
        porFileira[p.fileira].push(p);
      });

      const container = document.getElementById("mapa-onibus");
      container.innerHTML = Object.keys(porFileira)
        .sort((a, b) => a - b)
        .map((fileira) => {
          const assentos = porFileira[fileira].sort((a, b) => a.coluna - b.coluna);
          const celulas = [];
          assentos.forEach((p) => {
            if (p.coluna === 3) celulas.push('<div class="poltrona corredor"></div>');
            const classes = ["poltrona", p.status];
            if (p.poltrona_viagem_id === poltronaSelecionadaId) classes.push("selecionada");
            const tituloCategoria = p.categoria && p.categoria !== "padrao" ? `${p.categoria} · R$ ${p.preco.toFixed(2)}` : `R$ ${p.preco.toFixed(2)}`;
            celulas.push(
              `<div class="${classes.join(" ")}" data-id="${p.poltrona_viagem_id}" data-status="${p.status}" data-numero="${p.numero}" data-preco="${p.preco}" title="${tituloCategoria}">${p.numero}</div>`
            );
          });
          return `<div class="fileira-poltronas">${celulas.join("")}</div>`;
        })
        .join("");

      container.querySelectorAll(".poltrona[data-id]").forEach((el) => {
        el.addEventListener("click", () => onClicarPoltrona(el));
      });
    }

    async function onClicarPoltrona(el) {
      const poltronaId = parseInt(el.dataset.id, 10);
      const status = el.dataset.status;
      const modoBloqueio = document.getElementById("modo-bloqueio").checked;

      try {
        if (modoBloqueio) {
          if (status === "bloqueada") {
            await api("POST", `/viagens/${viagemId}/poltronas/${poltronaId}/desbloquear${queryTrecho()}`);
            mostrarAlerta("Poltrona desbloqueada.", "sucesso");
          } else if (status === "livre") {
            const motivo = prompt("Motivo do bloqueio (ex: manutenção, reservada para tripulação):");
            if (!motivo) return;
            await api("POST", `/viagens/${viagemId}/poltronas/${poltronaId}/bloquear${queryTrecho()}`, { motivo });
            mostrarAlerta("Poltrona bloqueada.", "sucesso");
          } else {
            mostrarAlerta("Só é possível bloquear poltronas livres.");
            return;
          }
          await carregarMapa();
          return;
        }

        if (status !== "livre") {
          mostrarAlerta("Esta poltrona não está disponível.");
          return;
        }

        await api("POST", `/viagens/${viagemId}/poltronas/${poltronaId}/hold${queryTrecho()}`);
        poltronaSelecionadaId = poltronaId;
        document.getElementById("numero-selecionada").textContent = el.dataset.numero;
        document.getElementById("preco-selecionada").textContent = `Preço: R$ ${Number(el.dataset.preco).toFixed(2)}`;
        document.getElementById("cartao-venda").classList.remove("escondido");
        await carregarMapa();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    }

    document.getElementById("btn-liberar").addEventListener("click", async () => {
      if (!poltronaSelecionadaId) return;
      try {
        await api("POST", `/viagens/${viagemId}/poltronas/${poltronaSelecionadaId}/liberar${queryTrecho()}`);
        esconderFormularioVenda();
        carregarMapa();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });

    document.getElementById("form-venda").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (!poltronaSelecionadaId) return;
      try {
        const resposta = await api("POST", `/viagens/${viagemId}/passagens`, {
          poltrona_viagem_id: poltronaSelecionadaId,
          cliente_nome: document.getElementById("cliente-nome").value.trim(),
          cliente_documento: document.getElementById("cliente-documento").value.trim(),
          cliente_telefone: document.getElementById("cliente-telefone").value.trim() || null,
          tipo_documento: document.getElementById("tipo-documento").value,
          categoria_passageiro: document.getElementById("categoria-passageiro").value,
          forma_pagamento: document.getElementById("forma-pagamento").value,
          parada_origem_id: trechoOrigemId,
          parada_destino_id: trechoDestinoId,
          codigo_cupom: document.getElementById("codigo-cupom").value.trim() || null,
          parceiro_id: document.getElementById("parceiro-venda").value ? parseInt(document.getElementById("parceiro-venda").value, 10) : null,
        });

        if (resposta.pedido_pagamento) {
          document.getElementById("form-venda").classList.add("escondido");
          const areaPix = document.getElementById("area-pix");
          areaPix.classList.remove("escondido");
          renderizarPagamentoPix(areaPix, resposta.pedido_pagamento, {
            aoConfirmar: async (passagem) => {
              mostrarAlerta(
                passagem ? `Pagamento confirmado! Localizador: ${passagem.localizador}` : "Pagamento confirmado!",
                "sucesso"
              );
              document.getElementById("form-venda").classList.remove("escondido");
              areaPix.classList.add("escondido");
              esconderFormularioVenda();
              await Promise.all([carregarMapa(), carregarPassagens()]);
            },
          });
          return;
        }

        mostrarAlerta(`Passagem vendida! Localizador: ${resposta.passagem.localizador}`, "sucesso");
        esconderFormularioVenda();
        await Promise.all([carregarMapa(), carregarPassagens()]);
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });

    async function carregarPassagens() {
      const lista = await api("GET", `/viagens/${viagemId}/passagens`);
      const corpo = document.getElementById("corpo-passagens");
      document.getElementById("vazio-passagens").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map(
          (p) => `
        <tr>
          <td>${p.localizador}</td>
          <td>${p.cliente_nome}</td>
          <td>${p.cliente_documento}</td>
          <td>${p.origem_trecho ? `${p.origem_trecho} → ${p.destino_trecho}` : "-"}</td>
          <td>R$ ${Number(p.preco).toFixed(2)}</td>
          <td>
            <span class="selo ${p.status}">${p.status === "confirmada" ? "Confirmada" : "Cancelada"}</span>
            ${p.reembolsado_em ? `<span class="selo confirmada">Reembolsado R$ ${Number(p.valor_reembolsado).toFixed(2)}</span>` : ""}
          </td>
          <td>
            ${p.status === "confirmada" ? `<button class="secundario" data-bilhete="${p.localizador}">Bilhete PDF</button>` : ""}
            ${p.status === "confirmada" ? `<button class="secundario" data-nfse="${p.id}">Emitir NFS-e</button>` : ""}
            ${p.status === "confirmada" ? `<button class="perigo" data-cancelar="${p.id}">Cancelar</button>` : ""}
            ${p.status === "cancelada" && !p.reembolsado_em ? `<button class="secundario" data-reembolsar="${p.id}">Reembolsar</button>` : ""}
          </td>
        </tr>`
        )
        .join("");

      corpo.querySelectorAll("button[data-bilhete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          abrirArquivoAutenticado(`/passagens/${btn.dataset.bilhete}/bilhete.pdf`, "bilhete").catch((e) => mostrarAlerta(e.message));
        });
      });

      corpo.querySelectorAll("button[data-nfse]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            const nfse = await api("POST", `/viagens/${viagemId}/passagens/${btn.dataset.nfse}/nfse`);
            if (nfse.status === "simulada") {
              mostrarAlerta("Emissão de NFS-e ainda não configurada nesta instalação (terreno pronto — veja DEPLOY.md).");
            } else {
              mostrarAlerta(`Nota fiscal emitida: ${nfse.numero}`, "sucesso");
            }
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-cancelar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Cancelar esta passagem e liberar a poltrona?")) return;
          try {
            await api("POST", `/viagens/${viagemId}/passagens/${btn.dataset.cancelar}/cancelar`);
            mostrarAlerta("Passagem cancelada.", "sucesso");
            await Promise.all([carregarMapa(), carregarPassagens()]);
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-reembolsar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const passagem = lista.find((p) => p.id == btn.dataset.reembolsar);
          const valorStr = prompt(`Valor a reembolsar (R$, máx ${Number(passagem.preco).toFixed(2)}):`, Number(passagem.preco).toFixed(2));
          if (valorStr === null) return;
          const motivo = prompt("Motivo do reembolso:");
          if (!motivo) return;
          try {
            await api("POST", `/viagens/${viagemId}/passagens/${passagem.id}/reembolsar`, {
              valor: parseFloat(valorStr),
              motivo,
            });
            mostrarAlerta("Reembolso registrado.", "sucesso");
            carregarPassagens();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    async function carregarParceiros() {
      try {
        const lista = await api("GET", "/parceiros?apenas_ativos=true");
        const select = document.getElementById("parceiro-venda");
        lista
          .filter((p) => p.vende_passagem)
          .forEach((p) => {
            const opcao = document.createElement("option");
            opcao.value = p.id;
            opcao.textContent = p.nome;
            select.appendChild(opcao);
          });
      } catch (e) {
        // sem permissão ou sem parceiros — mantém só "Venda direta"
      }
    }

    if (auth && viagemId) {
      montarTopo("topo");
      carregarParadas()
        .then(() => Promise.all([carregarMapa(), carregarPassagens()]))
        .catch((e) => mostrarAlerta(e.message));
      carregarParceiros();
      intervaloAtualizacao = setInterval(() => {
        if (!poltronaSelecionadaId) carregarMapa().catch(() => {});
      }, 15000);
    }
  </script>
</body>
</html>
