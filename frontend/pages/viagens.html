<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Viagens</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#400056" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Viagens</h1>
    <p class="subtitulo">Crie viagens e gerencie a venda de passagens.</p>

    <div id="alerta"></div>

    <div class="cartao escondido" id="cartao-nova-viagem">
      <h2 style="margin-top:0">Nova viagem</h2>
      <form id="form-viagem">
        <div class="grid-form">
          <div>
            <label for="rota">Rota</label>
            <select id="rota" required></select>
          </div>
          <div>
            <label for="onibus">Ônibus</label>
            <select id="onibus" required></select>
          </div>
          <div>
            <label for="data-hora">Data e hora de partida</label>
            <input id="data-hora" type="datetime-local" required />
          </div>
          <div>
            <label for="preco">Preço (R$)</label>
            <input id="preco" type="number" min="0" step="0.01" required />
          </div>
          <div>
            <label for="motorista">Motorista (opcional)</label>
            <select id="motorista">
              <option value="">Não definido</option>
            </select>
          </div>
        </div>
        <div class="linha-acoes">
          <button type="submit">Criar viagem</button>
        </div>
      </form>
    </div>

    <h2>Próximas viagens</h2>
    <div class="cartao">
      <table>
        <thead><tr><th>Rota</th><th>Data/Hora</th><th>Ônibus</th><th>Preço</th><th>Motorista</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhuma viagem cadastrada ainda.</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/jornada.js"></script>
  <script src="/js/checklist.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa", "funcionario");
    const ehAdmin = auth && auth.role === "admin_empresa";

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
    }

    function formatarDataHora(iso) {
      const d = new Date(iso);
      return d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    async function carregarSelects() {
      const [rotas, onibusLista, motoristas] = await Promise.all([
        api("GET", "/rotas"),
        api("GET", "/onibus"),
        api("GET", "/motoristas?apenas_ativos=true"),
      ]);
      document.getElementById("rota").innerHTML = rotas
        .map((r) => `<option value="${r.id}">${r.origem} → ${r.destino}</option>`)
        .join("");
      document.getElementById("onibus").innerHTML = onibusLista
        .map((o) => `<option value="${o.id}">${o.identificacao} (${o.poltronas.length} poltronas)</option>`)
        .join("");
      document.getElementById("motorista").innerHTML =
        `<option value="">Não definido</option>` + motoristas.map((m) => `<option value="${m.id}">${m.nome}</option>`).join("");
    }

    async function carregarViagens() {
      const lista = await api("GET", "/viagens");
      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map(
          (v) => `
        <tr>
          <td>${v.rota.origem} → ${v.rota.destino}</td>
          <td>${formatarDataHora(v.data_hora_partida)}</td>
          <td>${v.onibus.identificacao}</td>
          <td>R$ ${Number(v.preco).toFixed(2)}</td>
          <td>${v.motorista_nome || "—"}</td>
          <td><span class="selo ${v.ativo ? "livre" : "bloqueada"}">${v.ativo ? "Ativa" : "Cancelada"}</span></td>
          <td>
            <a href="/pages/mapa-poltronas.html?viagem_id=${v.id}"><button>Mapa de poltronas</button></a>
            <a href="/pages/mapa-viagem.html?id=${v.id}"><button class="secundario">Rastrear ao vivo</button></a>
            <button class="secundario" data-manifesto="${v.id}">Manifesto PDF</button>
            <button class="secundario" data-jornada="${v.id}" data-motorista="${v.motorista_nome || ""}">Jornada</button>
            <button class="secundario" data-checklist="${v.id}" data-motorista="${v.motorista_nome || ""}">Checklist</button>
            ${ehAdmin ? `<button class="secundario" data-editar="${v.id}">Editar</button>` : ""}
            ${ehAdmin
              ? v.ativo
                ? `<button class="perigo" data-desativar="${v.id}">Cancelar</button>`
                : `<button class="secundario" data-ativar="${v.id}">Reativar</button>`
              : ""}
          </td>
        </tr>`
        )
        .join("");

      corpo.querySelectorAll("button[data-jornada]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogJornada("viagem", parseInt(btn.dataset.jornada, 10), btn.dataset.motorista));
      });

      corpo.querySelectorAll("button[data-checklist]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogChecklist("viagem", parseInt(btn.dataset.checklist, 10), btn.dataset.motorista));
      });

      corpo.querySelectorAll("button[data-manifesto]").forEach((btn) => {
        btn.addEventListener("click", () => {
          abrirArquivoAutenticado(`/viagens/${btn.dataset.manifesto}/manifesto.pdf`, "manifesto").catch((e) => mostrarAlerta(e.message));
        });
      });

      if (!ehAdmin) return;

      corpo.querySelectorAll("button[data-editar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const item = lista.find((v) => v.id == btn.dataset.editar);
          const novoPreco = prompt("Novo preço (R$):", Number(item.preco).toFixed(2));
          if (novoPreco === null) return;
          try {
            await api("PATCH", `/viagens/${item.id}`, { preco: parseFloat(novoPreco) });
            mostrarAlerta("Viagem atualizada.", "sucesso");
            carregarViagens();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-desativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Cancelar esta viagem? Ela sai da busca de clientes, mas passagens já vendidas continuam válidas.")) return;
          try {
            await api("PATCH", `/viagens/${btn.dataset.desativar}/desativar`);
            carregarViagens();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-ativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("PATCH", `/viagens/${btn.dataset.ativar}/ativar`);
            carregarViagens();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    if (auth) {
      montarTopo("topo");
      if (ehAdmin) {
        document.getElementById("cartao-nova-viagem").classList.remove("escondido");
        carregarSelects().catch((e) => mostrarAlerta(e.message));
      }
      carregarViagens().catch((e) => mostrarAlerta(e.message));
    }

    document.getElementById("form-viagem").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const dataHora = document.getElementById("data-hora").value;
        await api("POST", "/viagens", {
          rota_id: parseInt(document.getElementById("rota").value, 10),
          onibus_id: parseInt(document.getElementById("onibus").value, 10),
          data_hora_partida: new Date(dataHora).toISOString(),
          preco: parseFloat(document.getElementById("preco").value),
          motorista_id: document.getElementById("motorista").value ? parseInt(document.getElementById("motorista").value, 10) : null,
        });
        ev.target.reset();
        mostrarAlerta("Viagem criada com sucesso.", "sucesso");
        carregarViagens();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });
  </script>
</body>
</html>
