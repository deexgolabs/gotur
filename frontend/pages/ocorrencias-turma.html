<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kivo — Agenda de aulas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#400056" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Agenda de aulas</h1>
    <p class="subtitulo" id="subtitulo">Próximas ocorrências das turmas.</p>

    <div id="alerta"></div>

    <div class="cartao">
      <table>
        <thead><tr><th>Turma</th><th>Data/Hora</th><th>Vagas</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhuma ocorrência encontrada.</p>
    </div>
  </main>

  <dialog id="dialog-reservas" style="border:none;border-radius:8px;padding:24px;max-width:560px;width:100%">
    <h2 style="margin-top:0" id="titulo-dialog-reservas">Reservas</h2>
    <table>
      <thead><tr><th>Aluno</th><th>Tipo</th><th>Status</th><th>Check-in</th></tr></thead>
      <tbody id="corpo-reservas"></tbody>
    </table>
    <p class="vazio escondido" id="vazio-reservas">Nenhuma reserva ainda.</p>
    <div class="linha-acoes">
      <button type="button" class="secundario" id="btn-fechar-reservas">Fechar</button>
    </div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa", "funcionario");
    const params = new URLSearchParams(window.location.search);
    const turmaId = params.get("turma_id");
    let empresaSlug = null;

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
      if (tipo === "sucesso") {
        setTimeout(() => (document.getElementById("alerta").innerHTML = ""), 4000);
      }
    }

    function formatarDataHora(iso) {
      return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    async function carregarEmpresa() {
      try {
        const empresa = await api("GET", "/empresas/minha");
        empresaSlug = empresa.slug || null;
      } catch (e) {
        empresaSlug = null;
      }
    }

    async function copiarLink(url) {
      try {
        await navigator.clipboard.writeText(url);
        mostrarAlerta("Link copiado!", "sucesso");
      } catch (e) {
        prompt("Copie o link abaixo:", url);
      }
    }

    async function carregar() {
      const lista = turmaId
        ? await api("GET", `/turmas/${turmaId}/ocorrencias`)
        : await api("GET", "/ocorrencias-turma");

      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map((o) => {
          const passou = new Date(o.data_hora_inicio) < new Date();
          return `
        <tr>
          <td>${o.nome_turma}</td>
          <td>${formatarDataHora(o.data_hora_inicio)}</td>
          <td>${o.vagas_ocupadas} / ${o.capacidade_vagas}</td>
          <td><span class="selo ${o.cancelada ? "bloqueada" : "livre"}">${o.cancelada ? "Cancelada" : "Normal"}</span></td>
          <td>
            <button class="secundario" data-reservas="${o.id}">Ver reservas</button>
            ${empresaSlug && !o.cancelada && !passou ? `<button class="secundario" data-copiar-link="${o.id}">Copiar link</button>` : ""}
            ${!o.cancelada && !passou ? `<button class="perigo" data-cancelar="${o.id}">Cancelar aula</button>` : ""}
          </td>
        </tr>`;
        })
        .join("");

      corpo.querySelectorAll("button[data-reservas]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogReservas(lista.find((o) => o.id == btn.dataset.reservas)));
      });

      corpo.querySelectorAll("button[data-copiar-link]").forEach((btn) => {
        btn.addEventListener("click", () => {
          copiarLink(`${window.location.origin}/loja/${empresaSlug}/aulas/${btn.dataset.copiarLink}`);
        });
      });

      corpo.querySelectorAll("button[data-cancelar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Cancelar esta aula? As reservas confirmadas também serão canceladas.")) return;
          try {
            await api("PATCH", `/ocorrencias-turma/${btn.dataset.cancelar}/cancelar`);
            mostrarAlerta("Aula cancelada.", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    const ROTULOS_TIPO = { matricula: "Matrícula", avulsa: "Avulsa" };

    async function abrirDialogReservas(ocorrencia) {
      document.getElementById("titulo-dialog-reservas").textContent = `Reservas — ${ocorrencia.nome_turma} (${formatarDataHora(ocorrencia.data_hora_inicio)})`;
      try {
        const reservas = await api("GET", `/ocorrencias-turma/${ocorrencia.id}/reservas`);
        const corpo = document.getElementById("corpo-reservas");
        document.getElementById("vazio-reservas").classList.toggle("escondido", reservas.length > 0);
        corpo.innerHTML = reservas
          .map(
            (r) => `
          <tr>
            <td>${r.cliente_nome || "—"}</td>
            <td>${ROTULOS_TIPO[r.tipo_reserva] || r.tipo_reserva}</td>
            <td><span class="selo ${r.status}">${r.status === "confirmada" ? "Confirmada" : "Cancelada"}</span></td>
            <td>${r.checkin_em ? formatarDataHora(r.checkin_em) : "—"}</td>
          </tr>`
          )
          .join("");
        document.getElementById("dialog-reservas").showModal();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    }

    document.getElementById("btn-fechar-reservas").addEventListener("click", () => {
      document.getElementById("dialog-reservas").close();
    });

    if (auth) {
      montarTopo("topo");
      if (turmaId) {
        document.getElementById("subtitulo").textContent = "Ocorrências desta turma.";
      }
      carregarEmpresa().then(() => carregar()).catch((e) => mostrarAlerta(e.message));
    }
  </script>
</body>
</html>
