<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Minhas faturas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Minhas faturas</h1>
    <p class="subtitulo">Cobranças da assinatura do GoTur para a sua empresa.</p>

    <div id="alerta"></div>

    <div id="lista"></div>
    <p class="vazio escondido" id="vazio">Nenhuma fatura ainda.</p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa");
    const ROTULOS = { pendente: "Pendente", paga: "Paga", falhou: "Falhou", cancelada: "Cancelada" };
    const SELOS = { pendente: "hold", paga: "livre", falhou: "bloqueada", cancelada: "bloqueada" };

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
      if (tipo === "sucesso") setTimeout(() => (document.getElementById("alerta").innerHTML = ""), 4000);
    }

    async function carregar() {
      const lista = await api("GET", "/faturas/minhas");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      document.getElementById("lista").innerHTML = lista
        .map(
          (f) => `
        <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-weight:700">Plano ${f.plano_nome || ""}</div>
            <div style="color:var(--cinza);font-size:.9rem">Vencimento: ${new Date(f.vencimento).toLocaleDateString("pt-BR")}</div>
          </div>
          <div style="text-align:right">
            <div style="margin-bottom:8px"><span class="selo ${SELOS[f.status]}">${ROTULOS[f.status]}</span></div>
            <div style="font-weight:700;margin-bottom:8px">R$ ${Number(f.valor).toFixed(2)}</div>
            ${f.status === "pendente" ? `<button data-pagar="${f.id}">Pagar agora</button>` : ""}
          </div>
        </div>`
        )
        .join("");

      document.querySelectorAll("button[data-pagar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("POST", `/faturas/${btn.dataset.pagar}/pagar`);
            mostrarAlerta("Pagamento registrado. Obrigado!", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    if (auth) {
      montarTopo("topo");
      carregar().catch((e) => mostrarAlerta(e.message));
    }
  </script>
</body>
</html>
