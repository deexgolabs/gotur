<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Minhas passagens</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#400056" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Minhas passagens</h1>
    <p class="subtitulo">Suas compras realizadas na GoTur.</p>

    <div id="alerta"></div>

    <div id="cupons-fidelidade" class="escondido"></div>
    <div id="card-indicacao" class="escondido"></div>

    <div id="lista"></div>
    <p class="vazio escondido" id="vazio">Você ainda não comprou nenhuma passagem.</p>
  </main>

  <dialog id="dialog-qrcode" style="border:none;border-radius:8px;padding:24px;max-width:320px;width:100%;text-align:center">
    <h2 style="margin-top:0" id="qrcode-localizador"></h2>
    <img id="qrcode-img" alt="QR Code da passagem" style="width:100%;max-width:220px" />
    <p class="rodape-form">Apresente este código no embarque.</p>
    <button type="button" class="secundario" id="btn-fechar-qrcode" style="width:100%">Fechar</button>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    const auth = exigirPapel("cliente");

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
    }

    function formatarHora(iso) {
      return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    async function carregar() {
      const lista = await api("GET", "/passagens/minhas");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      document.getElementById("lista").innerHTML = lista
        .map(
          (p) => `
        <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-weight:700">${p.empresa_nome} · ${p.origem} → ${p.destino}</div>
            <div style="color:var(--cinza);font-size:.9rem">${formatarHora(p.data_hora_partida)} · Poltrona ${p.numero_poltrona}</div>
            <div style="color:var(--cinza);font-size:.85rem">Localizador: <strong>${p.localizador}</strong> · Passageiro: ${p.cliente_nome}</div>
          </div>
          <div style="text-align:right">
            <div style="margin-bottom:8px"><span class="selo ${p.status}">${p.status === "confirmada" ? "Confirmada" : "Cancelada"}</span></div>
            <div style="font-weight:700;margin-bottom:8px">R$ ${Number(p.preco).toFixed(2)}</div>
            ${p.status === "confirmada" ? `<button class="secundario" data-qrcode="${p.localizador}" style="margin-right:8px">Ver QR Code</button>` : ""}
            ${p.status === "confirmada" ? `<button class="secundario" data-bilhete="${p.localizador}" style="margin-right:8px">Bilhete PDF</button>` : ""}
            ${p.status === "confirmada" && p.viagem_codigo_rastreio ? `<a href="/rastrear-viagem.html?codigo=${p.viagem_codigo_rastreio}" target="_blank" style="margin-right:8px"><button type="button" class="secundario">Rastrear meu ônibus</button></a>` : ""}
            ${p.status === "confirmada" ? `<button class="perigo" data-viagem="${p.viagem_id}" data-id="${p.id}">Cancelar</button>` : ""}
            ${p.nota_avaliacao ? `<div class="avaliacao-nota" style="margin-top:8px">${"★".repeat(p.nota_avaliacao)}${"☆".repeat(5 - p.nota_avaliacao)}</div>` : ""}
            ${p.pode_avaliar ? `<button class="secundario" data-avaliar="${p.id}" style="margin-top:8px">Avaliar viagem</button>` : ""}
          </div>
        </div>
        ${p.pode_avaliar ? `
        <div class="cartao escondido" id="form-avaliar-${p.id}" style="margin-top:-14px">
          <label>Sua nota</label>
          <div class="estrelas" data-estrelas="${p.id}">
            ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="estrela" data-nota="${n}">★</button>`).join("")}
          </div>
          <label for="comentario-${p.id}" style="margin-top:10px">Comentário (opcional)</label>
          <textarea id="comentario-${p.id}" rows="2" style="width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:6px;font-family:inherit"></textarea>
          <div class="linha-acoes">
            <button type="button" data-enviar-avaliacao="${p.id}">Enviar avaliação</button>
          </div>
        </div>` : ""}`
        )
        .join("");

      document.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Cancelar esta passagem?")) return;
          try {
            await api("POST", `/viagens/${btn.dataset.viagem}/passagens/${btn.dataset.id}/cancelar`);
            mostrarAlerta("Passagem cancelada.", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      document.querySelectorAll("button[data-qrcode]").forEach((btn) => {
        btn.addEventListener("click", () => abrirQrCode(btn.dataset.qrcode));
      });

      document.querySelectorAll("button[data-bilhete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          abrirArquivoAutenticado(`/passagens/${btn.dataset.bilhete}/bilhete.pdf`, "bilhete").catch((e) => mostrarAlerta(e.message));
        });
      });

      document.querySelectorAll("button[data-avaliar]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById(`form-avaliar-${btn.dataset.avaliar}`).classList.toggle("escondido");
        });
      });

      document.querySelectorAll(".estrelas").forEach((grupo) => {
        let notaEscolhida = 0;
        grupo.querySelectorAll(".estrela").forEach((estrela) => {
          estrela.addEventListener("click", () => {
            notaEscolhida = parseInt(estrela.dataset.nota, 10);
            grupo.dataset.notaEscolhida = notaEscolhida;
            grupo.querySelectorAll(".estrela").forEach((e) => {
              e.classList.toggle("ativa", parseInt(e.dataset.nota, 10) <= notaEscolhida);
            });
          });
        });
      });

      document.querySelectorAll("button[data-enviar-avaliacao]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const passagemId = btn.dataset.enviarAvaliacao;
          const grupo = document.querySelector(`.estrelas[data-estrelas="${passagemId}"]`);
          const nota = parseInt(grupo.dataset.notaEscolhida || "0", 10);
          if (!nota) {
            mostrarAlerta("Escolha uma nota de 1 a 5 estrelas.");
            return;
          }
          const comentario = document.getElementById(`comentario-${passagemId}`).value.trim();
          try {
            await api("POST", `/passagens/${passagemId}/avaliar`, { nota, comentario: comentario || null });
            mostrarAlerta("Obrigado pela avaliação!", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    async function abrirQrCode(localizador) {
      try {
        const auth = obterAuth();
        const resposta = await fetch(`/api/passagens/${localizador}/qrcode`, {
          headers: { Authorization: `Bearer ${auth.access_token}` },
        });
        if (!resposta.ok) throw new Error("Não foi possível gerar o QR Code.");
        const blob = await resposta.blob();
        document.getElementById("qrcode-img").src = URL.createObjectURL(blob);
        document.getElementById("qrcode-localizador").textContent = localizador;
        document.getElementById("dialog-qrcode").showModal();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    }

    async function carregarCuponsFidelidade() {
      try {
        const cupons = await api("GET", "/cupons/minhas");
        if (!cupons.length) return;
        const container = document.getElementById("cupons-fidelidade");
        container.classList.remove("escondido");
        container.innerHTML = `
          <div class="cartao" style="border-color:var(--verde)">
            <h2 style="margin-top:0">Seus cupons de fidelidade</h2>
            ${cupons
              .map(
                (c) => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--borda)">
                <div><strong>${c.codigo}</strong> — ${c.valor}% de desconto na próxima compra</div>
                <span class="selo ${c.usos_atuais < (c.max_usos || 1) ? "livre" : "bloqueada"}">${c.usos_atuais < (c.max_usos || 1) ? "Disponível" : "Usado"}</span>
              </div>`
              )
              .join("")}
          </div>`;
      } catch (erro) {
        // sem cupons ou papel sem acesso — não interrompe a página
      }
    }

    async function carregarIndicacao() {
      try {
        const perfil = await api("GET", "/usuarios/me");
        if (!perfil.codigo_indicacao) return;
        const link = `${window.location.origin}/index.html?indicacao=${perfil.codigo_indicacao}`;
        const container = document.getElementById("card-indicacao");
        container.classList.remove("escondido");
        container.innerHTML = `
          <div class="cartao">
            <h2 style="margin-top:0">Indique um amigo</h2>
            <p class="rodape-form" style="text-align:left;margin-top:-8px">Compartilhe seu link — quando seu amigo comprar a primeira passagem, vocês dois ganham cupom de desconto (se a empresa participar do programa).</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <input type="text" id="link-indicacao" readonly value="${link}" style="flex:1;min-width:240px" />
              <button type="button" class="secundario" id="btn-copiar-indicacao">Copiar link</button>
            </div>
          </div>`;
        document.getElementById("btn-copiar-indicacao").addEventListener("click", async () => {
          await navigator.clipboard.writeText(link);
          mostrarAlerta("Link copiado!", "sucesso");
        });
      } catch (erro) {
        // papel sem acesso ao próprio código — não interrompe a página
      }
    }

    if (auth) {
      montarTopo("topo");
      carregar().catch((e) => mostrarAlerta(e.message));
      carregarCuponsFidelidade();
      carregarIndicacao();
    }

    document.getElementById("btn-fechar-qrcode").addEventListener("click", () => {
      document.getElementById("dialog-qrcode").close();
    });
  </script>
</body>
</html>
