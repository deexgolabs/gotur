<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Rotas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08427a" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Rotas</h1>
    <p class="subtitulo">Origens e destinos atendidos pela sua empresa.</p>

    <div id="alerta"></div>

    <div class="cartao">
      <h2 style="margin-top:0">Nova rota</h2>
      <form id="form-rota">
        <div class="grid-form">
          <div>
            <label for="origem">Origem</label>
            <input id="origem" required />
          </div>
          <div>
            <label for="destino">Destino</label>
            <input id="destino" required />
          </div>
        </div>

        <div style="margin-top:16px">
          <label>Paradas intermediárias (opcional)</label>
          <p class="rodape-form" style="text-align:left;margin:0 0 8px">
            Permite vender só um trecho da viagem (ex: embarcar numa parada e desembarcar em outra). O preço de cada trecho é dividido igualmente entre os segmentos.
          </p>
          <div id="lista-paradas"></div>
          <button type="button" class="secundario" id="btn-add-parada" style="margin-top:6px">+ Adicionar parada intermediária</button>
        </div>

        <div class="linha-acoes" style="margin-top:16px">
          <button type="submit">Cadastrar rota</button>
        </div>
      </form>
    </div>

    <h2>Rotas cadastradas</h2>
    <div class="cartao">
      <table>
        <thead><tr><th>Trajeto</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhuma rota cadastrada ainda.</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa");

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
    }

    async function carregar() {
      const lista = await api("GET", "/rotas");
      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map((r) => {
          const paradas = [...r.paradas].sort((a, b) => a.ordem - b.ordem);
          const trajeto = paradas.length > 2 ? paradas.map((p) => p.nome).join(" → ") : `${r.origem} → ${r.destino}`;
          return `
        <tr>
          <td>${trajeto}</td>
          <td><span class="selo ${r.ativo ? "livre" : "bloqueada"}">${r.ativo ? "Ativa" : "Inativa"}</span></td>
          <td>
            <button class="secundario" data-editar="${r.id}">Editar</button>
            ${r.ativo
              ? `<button class="perigo" data-desativar="${r.id}">Desativar</button>`
              : `<button class="secundario" data-ativar="${r.id}">Reativar</button>`}
          </td>
        </tr>`;
        })
        .join("");

      corpo.querySelectorAll("button[data-editar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const linha = lista.find((r) => r.id == btn.dataset.editar);
          const novaOrigem = prompt("Origem:", linha.origem);
          if (novaOrigem === null) return;
          const novoDestino = prompt("Destino:", linha.destino);
          if (novoDestino === null) return;
          try {
            await api("PATCH", `/rotas/${linha.id}`, { origem: novaOrigem.trim(), destino: novoDestino.trim() });
            mostrarAlerta("Rota atualizada.", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-desativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("PATCH", `/rotas/${btn.dataset.desativar}/desativar`);
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-ativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("PATCH", `/rotas/${btn.dataset.ativar}/ativar`);
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    if (auth) {
      montarTopo("topo");
      carregar().catch((e) => mostrarAlerta(e.message));
    }

    document.getElementById("btn-add-parada").addEventListener("click", () => {
      const linha = document.createElement("div");
      linha.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center";
      linha.innerHTML = `
        <input type="text" placeholder="Nome da parada" style="flex:1" class="input-nome-parada" />
        <button type="button" class="perigo" style="padding:9px 12px">Remover</button>
      `;
      linha.querySelector("button").addEventListener("click", () => linha.remove());
      document.getElementById("lista-paradas").appendChild(linha);
    });

    document.getElementById("form-rota").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const origem = document.getElementById("origem").value.trim();
        const destino = document.getElementById("destino").value.trim();
        const intermediarias = Array.from(document.querySelectorAll(".input-nome-parada"))
          .map((el) => el.value.trim())
          .filter(Boolean);

        const corpo = { origem, destino };
        if (intermediarias.length) {
          corpo.paradas = [
            { nome: origem },
            ...intermediarias.map((nome) => ({ nome })),
            { nome: destino, peso_proximo: null },
          ];
        }

        await api("POST", "/rotas", corpo);
        ev.target.reset();
        document.getElementById("lista-paradas").innerHTML = "";
        mostrarAlerta("Rota cadastrada com sucesso.", "sucesso");
        carregar();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });
  </script>
</body>
</html>
