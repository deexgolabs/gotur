<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Fretes</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08427a" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Fretes</h1>
    <p class="subtitulo">Envio de encomendas/carga — funciona mesmo sem nenhum ônibus cadastrado.</p>

    <div id="alerta"></div>

    <div class="cartao escondido" id="cartao-novo">
      <h2 style="margin-top:0">Novo frete</h2>
      <form id="form-frete">
        <div class="grid-form">
          <div>
            <label for="remetente-nome">Remetente</label>
            <input id="remetente-nome" required />
          </div>
          <div>
            <label for="remetente-contato">Contato do remetente</label>
            <input id="remetente-contato" placeholder="Telefone ou e-mail" />
          </div>
          <div>
            <label for="destinatario-nome">Destinatário</label>
            <input id="destinatario-nome" required />
          </div>
          <div>
            <label for="destinatario-contato">Contato do destinatário</label>
            <input id="destinatario-contato" placeholder="Telefone ou e-mail" />
          </div>
          <div>
            <label for="origem">Origem</label>
            <input id="origem" required />
          </div>
          <div>
            <label for="destino">Destino</label>
            <input id="destino" required />
          </div>
          <div>
            <label for="coleta">Data/hora de coleta</label>
            <input id="coleta" type="datetime-local" required />
          </div>
          <div>
            <label for="entrega-prevista">Entrega prevista</label>
            <input id="entrega-prevista" type="datetime-local" />
          </div>
          <div>
            <label for="descricao-carga">O que está sendo enviado</label>
            <input id="descricao-carga" placeholder="Ex: caixa 5kg, documentos..." />
          </div>
          <div>
            <label for="motorista">Motorista</label>
            <select id="motorista">
              <option value="">Não definido</option>
            </select>
          </div>
          <div>
            <label for="veiculo">Veículo</label>
            <input id="veiculo" placeholder="Ex: Caminhão placa ABC-1234" />
          </div>
          <div>
            <label for="icone-mapa">Ícone no mapa</label>
            <select id="icone-mapa">
              <option value="🚚">🚚 Caminhão</option>
              <option value="🚐">🚐 Van</option>
              <option value="🚗">🚗 Carro</option>
              <option value="🏍️">🏍️ Moto</option>
            </select>
          </div>
          <div>
            <label for="distancia">Distância prevista (km)</label>
            <input id="distancia" type="number" min="0" step="0.1" />
          </div>
          <div>
            <label for="valor-km">Preço por km (R$)</label>
            <input id="valor-km" type="number" min="0" step="0.01" />
          </div>
          <div>
            <label for="valor-total">Valor total (R$)</label>
            <input id="valor-total" type="number" min="0" step="0.01" placeholder="Calculado automaticamente" />
          </div>
          <div>
            <label for="peso">Peso (kg)</label>
            <input id="peso" type="number" min="0" step="0.1" />
          </div>
          <div>
            <label for="volumes">Quantidade de volumes</label>
            <input id="volumes" type="number" min="0" step="1" />
          </div>
          <div>
            <label for="valor-declarado">Valor declarado da mercadoria (R$)</label>
            <input id="valor-declarado" type="number" min="0" step="0.01" />
          </div>
          <div>
            <label for="parceiro-frete">Parceiro (opcional)</label>
            <select id="parceiro-frete">
              <option value="">Despacho direto</option>
            </select>
          </div>
        </div>
        <div>
          <label for="observacoes">Observações</label>
          <input id="observacoes" />
        </div>
        <div class="linha-acoes">
          <button type="submit">Cadastrar frete</button>
        </div>
      </form>
    </div>

    <h2>Fretes cadastrados</h2>
    <div class="cartao">
      <table>
        <thead>
          <tr><th>Remetente → Destinatário</th><th>Trajeto</th><th>Coleta</th><th>Km percorrido</th><th>Valor</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhum frete cadastrado ainda.</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/jornada.js"></script>
  <script src="/js/checklist.js"></script>
  <script>
    const auth = exigirPapel("admin_empresa", "funcionario");
    const ehAdmin = auth && auth.role === "admin_empresa";
    let empresaSlug = null;

    const ROTULOS_STATUS = {
      solicitado: "Solicitado",
      confirmado: "Confirmado",
      em_transito: "Em trânsito",
      entregue: "Entregue",
      cancelado: "Cancelado",
    };
    const SELO_STATUS = {
      solicitado: "hold",
      confirmado: "livre",
      em_transito: "confirmada",
      entregue: "livre",
      cancelado: "bloqueada",
    };

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
      if (tipo === "sucesso") setTimeout(() => (document.getElementById("alerta").innerHTML = ""), 4000);
    }

    function formatarDataHora(iso) {
      return iso ? new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "-";
    }

    async function carregar() {
      const lista = await api("GET", "/fretes");
      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map(
          (f) => `
        <tr>
          <td>${f.icone_mapa} ${f.remetente_nome} → ${f.destinatario_nome}</td>
          <td>${f.origem} → ${f.destino}</td>
          <td>${formatarDataHora(f.data_hora_coleta)}</td>
          <td>${f.distancia_percorrida_km.toFixed(1)}</td>
          <td>${f.valor_total != null ? "R$ " + f.valor_total.toFixed(2) : "-"}</td>
          <td><span class="selo ${SELO_STATUS[f.status]}">${ROTULOS_STATUS[f.status]}</span></td>
          <td>
            <a href="/pages/mapa-frete.html?id=${f.id}"><button class="secundario">Mapa</button></a>
            <button class="secundario" data-status="${f.id}">Status</button>
            <button class="secundario" data-jornada="${f.id}" data-motorista="${f.motorista_nome || ""}">Jornada</button>
            <button class="secundario" data-checklist="${f.id}" data-motorista="${f.motorista_nome || ""}">Checklist</button>
            ${f.status === "entregue" ? `<button class="secundario" data-nfse="${f.id}">Emitir NFS-e</button>` : ""}
            <button class="secundario" data-copiar="${f.codigo_rastreio}">Copiar link p/ acompanhar</button>
          </td>
        </tr>`
        )
        .join("");

      corpo.querySelectorAll("button[data-status]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const opcoes = Object.entries(ROTULOS_STATUS).map(([v, l]) => `${v} - ${l}`).join("\n");
          const escolha = prompt(`Novo status:\n${opcoes}`);
          if (!escolha) return;
          const valor = escolha.trim().split(" ")[0];
          if (!ROTULOS_STATUS[valor]) {
            mostrarAlerta("Status inválido.");
            return;
          }
          try {
            await api("PATCH", `/fretes/${btn.dataset.status}/status`, { status: valor });
            mostrarAlerta("Status atualizado.", "sucesso");
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-jornada]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogJornada("frete", parseInt(btn.dataset.jornada, 10), btn.dataset.motorista));
      });

      corpo.querySelectorAll("button[data-checklist]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogChecklist("frete", parseInt(btn.dataset.checklist, 10), btn.dataset.motorista));
      });

      corpo.querySelectorAll("button[data-nfse]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            const nfse = await api("POST", `/fretes/${btn.dataset.nfse}/nfse`);
            if (nfse.status === "simulada") {
              mostrarAlerta("NFS-e não emitida: configure um agregador (Focus NFe, NFE.io, PlugNotas) no servidor.", "erro");
            } else {
              mostrarAlerta(`Nota fiscal emitida: ${nfse.numero}`, "sucesso");
            }
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-copiar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const link = empresaSlug
            ? `${window.location.origin}/loja/${empresaSlug}?frete=${btn.dataset.copiar}`
            : `${window.location.origin}/rastrear-frete.html?codigo=${btn.dataset.copiar}`;
          try {
            await navigator.clipboard.writeText(link);
            mostrarAlerta("Link copiado! Envie para quem for acompanhar.", "sucesso");
          } catch {
            prompt("Copie o link abaixo:", link);
          }
        });
      });
    }

    async function carregarParceiros() {
      try {
        const lista = await api("GET", "/parceiros?apenas_ativos=true");
        const select = document.getElementById("parceiro-frete");
        lista
          .filter((p) => p.despacha_frete)
          .forEach((p) => {
            const opcao = document.createElement("option");
            opcao.value = p.id;
            opcao.textContent = p.nome;
            select.appendChild(opcao);
          });
      } catch (e) {
        // sem permissão (funcionário sem acesso a parceiros) ou sem parceiros
      }
    }

    async function carregarMotoristas() {
      const lista = await api("GET", "/motoristas?apenas_ativos=true");
      document.getElementById("motorista").innerHTML =
        `<option value="">Não definido</option>` + lista.map((m) => `<option value="${m.id}">${m.nome}</option>`).join("");
    }

    if (auth) {
      montarTopo("topo");
      if (ehAdmin) document.getElementById("cartao-novo").classList.remove("escondido");
      api("GET", "/empresas/minha")
        .then((empresa) => (empresaSlug = empresa.slug))
        .catch(() => {});
      carregar().catch((e) => mostrarAlerta(e.message));
      carregarMotoristas().catch((e) => mostrarAlerta(e.message));
      if (ehAdmin) carregarParceiros();
    }

    document.getElementById("form-frete").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const lerNum = (id) => {
          const v = document.getElementById(id).value.trim();
          return v === "" ? null : parseFloat(v);
        };
        const coleta = document.getElementById("coleta").value;
        const entregaPrevista = document.getElementById("entrega-prevista").value;
        await api("POST", "/fretes", {
          remetente_nome: document.getElementById("remetente-nome").value.trim(),
          remetente_contato: document.getElementById("remetente-contato").value.trim() || null,
          destinatario_nome: document.getElementById("destinatario-nome").value.trim(),
          destinatario_contato: document.getElementById("destinatario-contato").value.trim() || null,
          descricao_carga: document.getElementById("descricao-carga").value.trim() || null,
          origem: document.getElementById("origem").value.trim(),
          destino: document.getElementById("destino").value.trim(),
          data_hora_coleta: new Date(coleta).toISOString(),
          data_hora_entrega_prevista: entregaPrevista ? new Date(entregaPrevista).toISOString() : null,
          motorista_id: document.getElementById("motorista").value ? parseInt(document.getElementById("motorista").value, 10) : null,
          veiculo_descricao: document.getElementById("veiculo").value.trim() || null,
          icone_mapa: document.getElementById("icone-mapa").value,
          distancia_km: lerNum("distancia"),
          valor_por_km: lerNum("valor-km"),
          valor_total: lerNum("valor-total"),
          peso_kg: lerNum("peso"),
          quantidade_volumes: (() => {
            const v = document.getElementById("volumes").value.trim();
            return v === "" ? null : parseInt(v, 10);
          })(),
          valor_declarado: lerNum("valor-declarado"),
          parceiro_id: document.getElementById("parceiro-frete").value ? parseInt(document.getElementById("parceiro-frete").value, 10) : null,
          observacoes: document.getElementById("observacoes").value.trim() || null,
        });
        ev.target.reset();
        mostrarAlerta("Frete cadastrado com sucesso.", "sucesso");
        carregar();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });
  </script>
</body>
</html>
