<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Planos</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08427a" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Planos</h1>
    <p class="subtitulo">Planos de assinatura da plataforma, oferecidos às viações.</p>

    <div id="alerta"></div>

    <div class="cartao">
      <h2 style="margin-top:0">Novo plano</h2>
      <form id="form-plano">
        <div class="grid-form">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" required placeholder="Ex: Básico" />
          </div>
          <div>
            <label for="preco">Preço mensal (R$)</label>
            <input id="preco" type="number" min="0" step="0.01" required />
          </div>
          <div>
            <label for="max-onibus">Limite de ônibus</label>
            <input id="max-onibus" type="number" min="0" placeholder="Vazio = ilimitado" />
          </div>
          <div>
            <label for="max-funcionarios">Limite de funcionários</label>
            <input id="max-funcionarios" type="number" min="0" placeholder="Vazio = ilimitado" />
          </div>
          <div>
            <label for="max-viagens">Limite de viagens/mês</label>
            <input id="max-viagens" type="number" min="0" placeholder="Vazio = ilimitado" />
          </div>
          <div>
            <label for="descricao">Descrição</label>
            <input id="descricao" placeholder="Opcional" />
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:12px 0 4px">
          <input type="checkbox" id="inclui-passagens" checked style="width:auto" />
          Inclui gestão de viagens
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px">
          <input type="checkbox" id="inclui-fretamento" checked style="width:auto" />
          Inclui fretamento
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px">
          <input type="checkbox" id="inclui-frete" checked style="width:auto" />
          Inclui frete
        </label>
        <div class="linha-acoes">
          <button type="submit">Cadastrar plano</button>
        </div>
      </form>
    </div>

    <h2>Planos cadastrados</h2>
    <div class="cartao">
      <table>
        <thead><tr><th>Nome</th><th>Preço/mês</th><th>Ônibus</th><th>Funcionários</th><th>Viagens/mês</th><th>Módulos</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhum plano cadastrado ainda.</p>
    </div>
  </main>

  <dialog id="dialog-editar-plano" style="border:none;border-radius:8px;padding:24px;max-width:520px;width:100%">
    <h2 style="margin-top:0">Editar plano</h2>
    <form id="form-editar-plano">
      <div class="grid-form">
        <div>
          <label for="editar-nome">Nome</label>
          <input id="editar-nome" required />
        </div>
        <div>
          <label for="editar-preco">Preço mensal (R$)</label>
          <input id="editar-preco" type="number" min="0" step="0.01" required />
        </div>
        <div>
          <label for="editar-max-onibus">Limite de ônibus</label>
          <input id="editar-max-onibus" type="number" min="0" placeholder="Vazio = ilimitado" />
        </div>
        <div>
          <label for="editar-max-funcionarios">Limite de funcionários</label>
          <input id="editar-max-funcionarios" type="number" min="0" placeholder="Vazio = ilimitado" />
        </div>
        <div>
          <label for="editar-max-viagens">Limite de viagens/mês</label>
          <input id="editar-max-viagens" type="number" min="0" placeholder="Vazio = ilimitado" />
        </div>
        <div>
          <label for="editar-descricao">Descrição</label>
          <input id="editar-descricao" placeholder="Opcional" />
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:12px 0 4px">
        <input type="checkbox" id="editar-inclui-passagens" style="width:auto" />
        Inclui gestão de viagens
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px">
        <input type="checkbox" id="editar-inclui-fretamento" style="width:auto" />
        Inclui fretamento
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px">
        <input type="checkbox" id="editar-inclui-frete" style="width:auto" />
        Inclui frete
      </label>
      <div class="linha-acoes">
        <button type="submit">Salvar alterações</button>
        <button type="button" class="secundario" id="btn-fechar-editar-plano">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    const auth = exigirPapel("super_admin");

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
      if (tipo === "sucesso") setTimeout(() => (document.getElementById("alerta").innerHTML = ""), 4000);
    }

    function fmtLimite(v) {
      return v === null || v === undefined ? "Ilimitado" : v;
    }

    async function carregar() {
      const lista = await api("GET", "/planos");
      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map(
          (p) => `
        <tr>
          <td>${p.nome}</td>
          <td>R$ ${Number(p.preco_mensal).toFixed(2)}</td>
          <td>${fmtLimite(p.max_onibus)}</td>
          <td>${fmtLimite(p.max_funcionarios)}</td>
          <td>${fmtLimite(p.max_viagens_mes)}</td>
          <td>
            <span class="selo ${p.modulo_passagens ? "livre" : "bloqueada"}" data-toggle-modulo="passagens" data-plano="${p.id}" style="cursor:pointer" title="Clique pra ligar/desligar">Viagens</span>
            <span class="selo ${p.modulo_fretamento ? "livre" : "bloqueada"}" data-toggle-modulo="fretamento" data-plano="${p.id}" style="cursor:pointer" title="Clique pra ligar/desligar">Fretamento</span>
            <span class="selo ${p.modulo_frete ? "livre" : "bloqueada"}" data-toggle-modulo="frete" data-plano="${p.id}" style="cursor:pointer" title="Clique pra ligar/desligar">Frete</span>
          </td>
          <td><span class="selo ${p.ativo ? "livre" : "bloqueada"}">${p.ativo ? "Ativo" : "Inativo"}</span></td>
          <td>
            <button class="secundario" data-editar="${p.id}">Editar</button>
            ${p.ativo ? `<button class="perigo" data-desativar="${p.id}">Desativar</button>` : `<button class="secundario" data-ativar="${p.id}">Reativar</button>`}
          </td>
        </tr>`
        )
        .join("");

      corpo.querySelectorAll("button[data-editar]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogEditar(lista.find((p) => p.id == btn.dataset.editar)));
      });

      corpo.querySelectorAll("button[data-desativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("PATCH", `/planos/${btn.dataset.desativar}/desativar`);
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("button[data-ativar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api("PATCH", `/planos/${btn.dataset.ativar}/ativar`);
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });

      corpo.querySelectorAll("[data-toggle-modulo]").forEach((selo) => {
        selo.addEventListener("click", async () => {
          const plano = lista.find((p) => p.id == selo.dataset.plano);
          const campo = { passagens: "modulo_passagens", fretamento: "modulo_fretamento", frete: "modulo_frete" }[selo.dataset.toggleModulo];
          try {
            await api("PATCH", `/planos/${plano.id}`, { [campo]: !plano[campo] });
            carregar();
          } catch (erro) {
            mostrarAlerta(erro.message);
          }
        });
      });
    }

    let planoEditandoId = null;

    function abrirDialogEditar(plano) {
      planoEditandoId = plano.id;
      document.getElementById("editar-nome").value = plano.nome;
      document.getElementById("editar-preco").value = Number(plano.preco_mensal).toFixed(2);
      document.getElementById("editar-max-onibus").value = plano.max_onibus ?? "";
      document.getElementById("editar-max-funcionarios").value = plano.max_funcionarios ?? "";
      document.getElementById("editar-max-viagens").value = plano.max_viagens_mes ?? "";
      document.getElementById("editar-descricao").value = plano.descricao || "";
      document.getElementById("editar-inclui-passagens").checked = plano.modulo_passagens;
      document.getElementById("editar-inclui-fretamento").checked = plano.modulo_fretamento;
      document.getElementById("editar-inclui-frete").checked = plano.modulo_frete;
      document.getElementById("dialog-editar-plano").showModal();
    }

    document.getElementById("btn-fechar-editar-plano").addEventListener("click", () => {
      document.getElementById("dialog-editar-plano").close();
    });

    document.getElementById("form-editar-plano").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const lerInt = (id) => {
          const v = document.getElementById(id).value.trim();
          return v === "" ? null : parseInt(v, 10);
        };
        await api("PATCH", `/planos/${planoEditandoId}`, {
          nome: document.getElementById("editar-nome").value.trim(),
          preco_mensal: parseFloat(document.getElementById("editar-preco").value),
          max_onibus: lerInt("editar-max-onibus"),
          max_funcionarios: lerInt("editar-max-funcionarios"),
          max_viagens_mes: lerInt("editar-max-viagens"),
          descricao: document.getElementById("editar-descricao").value.trim() || null,
          modulo_passagens: document.getElementById("editar-inclui-passagens").checked,
          modulo_fretamento: document.getElementById("editar-inclui-fretamento").checked,
          modulo_frete: document.getElementById("editar-inclui-frete").checked,
        });
        document.getElementById("dialog-editar-plano").close();
        mostrarAlerta("Plano atualizado.", "sucesso");
        carregar();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });

    if (auth) {
      montarTopo("topo");
      carregar().catch((e) => mostrarAlerta(e.message));
    }

    document.getElementById("form-plano").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const lerInt = (id) => {
          const v = document.getElementById(id).value.trim();
          return v === "" ? null : parseInt(v, 10);
        };
        await api("POST", "/planos", {
          nome: document.getElementById("nome").value.trim(),
          preco_mensal: parseFloat(document.getElementById("preco").value),
          max_onibus: lerInt("max-onibus"),
          max_funcionarios: lerInt("max-funcionarios"),
          max_viagens_mes: lerInt("max-viagens"),
          descricao: document.getElementById("descricao").value.trim() || null,
          modulo_passagens: document.getElementById("inclui-passagens").checked,
          modulo_fretamento: document.getElementById("inclui-fretamento").checked,
          modulo_frete: document.getElementById("inclui-frete").checked,
        });
        ev.target.reset();
        mostrarAlerta("Plano cadastrado com sucesso.", "sucesso");
        carregar();
      } catch (erro) {
        mostrarAlerta(erro.message);
      }
    });
  </script>
</body>
</html>
