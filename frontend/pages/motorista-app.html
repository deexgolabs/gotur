<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Minha jornada</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08427a" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="topo"></div>
  <main>
    <h1>Minha jornada</h1>
    <p class="subtitulo">Suas viagens, fretamentos e fretes de hoje em diante — controle sua jornada e o checklist do veículo direto daqui.</p>

    <div id="alerta"></div>

    <div class="cartao">
      <table>
        <thead><tr><th>Tipo</th><th>Trajeto</th><th>Data/Hora</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio escondido" id="vazio">Nenhuma viagem, fretamento ou frete atribuído a você no momento.</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/jornada.js"></script>
  <script src="/js/checklist.js"></script>
  <script>
    const auth = exigirPapel("motorista");

    const ROTULOS_TIPO = { viagem: "🚌 Viagem", fretamento: "🚌 Fretamento", frete: "🚚 Frete" };
    const ROTULOS_STATUS = {
      ativa: "Ativa",
      orcamento: "Orçamento",
      confirmado: "Confirmado",
      em_andamento: "Em andamento",
      em_transito: "Em trânsito",
      concluido: "Concluído",
      entregue: "Entregue",
      cancelado: "Cancelado",
    };

    function mostrarAlerta(mensagem, tipo = "erro") {
      document.getElementById("alerta").innerHTML = `<div class="alerta ${tipo}">${mensagem}</div>`;
    }

    function formatarDataHora(iso) {
      return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    async function carregar() {
      const lista = await api("GET", "/motoristas/minha/viagens");
      const corpo = document.getElementById("corpo-tabela");
      document.getElementById("vazio").classList.toggle("escondido", lista.length > 0);
      corpo.innerHTML = lista
        .map(
          (item) => `
        <tr>
          <td>${ROTULOS_TIPO[item.tipo] || item.tipo}</td>
          <td>${item.origem} → ${item.destino}</td>
          <td>${formatarDataHora(item.data_hora)}</td>
          <td><span class="selo livre">${ROTULOS_STATUS[item.status] || item.status}</span></td>
          <td>
            <button class="secundario" data-jornada="${item.id}" data-tipo="${item.tipo}">Jornada</button>
            <button class="secundario" data-checklist="${item.id}" data-tipo="${item.tipo}">Checklist</button>
          </td>
        </tr>`
        )
        .join("");

      corpo.querySelectorAll("button[data-jornada]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogJornada(btn.dataset.tipo, parseInt(btn.dataset.jornada, 10), auth.nome));
      });
      corpo.querySelectorAll("button[data-checklist]").forEach((btn) => {
        btn.addEventListener("click", () => abrirDialogChecklist(btn.dataset.tipo, parseInt(btn.dataset.checklist, 10), auth.nome));
      });
    }

    if (auth) {
      montarTopo("topo");
      carregar().catch((e) => mostrarAlerta(e.message));
    }
  </script>
</body>
</html>
