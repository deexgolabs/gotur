<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoTur — Acompanhar fretamento</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08427a" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #mapa { height: 420px; border-radius: 8px; border: 1px solid var(--borda); }
    body { background: var(--cinza-claro); }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <div class="marca">Go<span style="color:#4fd1a5">Tur</span></div>
    </div>
  </header>
  <main>
    <h1 id="titulo">Acompanhe seu fretamento</h1>
    <p class="subtitulo" id="subtitulo"></p>

    <div id="alerta"></div>

    <div class="cartoes-resumo" id="cartoes-resumo" style="margin-bottom:20px"></div>

    <button type="button" class="secundario" id="btn-ativar-push" style="margin-bottom:16px">Ativar notificações</button>

    <div class="cartao">
      <div id="mapa"></div>
      <p class="rodape-form" id="sem-posicao">Ainda não há posição registrada para este fretamento.</p>
    </div>

    <div id="area-avaliacao" class="cartao escondido" style="margin-top:20px"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/push.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = (params.get("codigo") || "").toUpperCase();

    document.getElementById("btn-ativar-push").addEventListener("click", async (ev) => {
      ev.target.disabled = true;
      try {
        await ativarPushRastreio(`/api/fretamentos/rastrear/${codigo}/push`);
        ev.target.textContent = "Notificações ativadas!";
      } catch (erro) {
        mostrarAlerta(erro.message);
        ev.target.disabled = false;
      }
    });

    function mostrarAlerta(mensagem) {
      document.getElementById("alerta").innerHTML = `<div class="alerta erro">${mensagem}</div>`;
    }

    const ROTULOS_STATUS = {
      orcamento: "Orçamento",
      confirmado: "Confirmado",
      em_andamento: "Em andamento",
      concluido: "Concluído",
      cancelado: "Cancelado",
    };

    let mapa, marcador, linha;

    function iconeEmoji(emoji) {
      return L.divIcon({
        html: `<div style="font-size:28px;line-height:1;transform:translate(-50%,-100%)">${emoji}</div>`,
        className: "",
        iconSize: [0, 0],
      });
    }

    function iniciarMapa() {
      mapa = L.map("mapa").setView([-14.235, -51.9253], 4);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19,
      }).addTo(mapa);
      linha = L.polyline([], { color: "#0b5fa5", weight: 4 }).addTo(mapa);
    }

    async function carregar() {
      const resposta = await fetch(`/api/fretamentos/rastrear/${codigo}`);
      if (!resposta.ok) {
        mostrarAlerta("Código de rastreio não encontrado.");
        return;
      }
      const dados = await resposta.json();

      document.getElementById("titulo").textContent = `Fretamento de ${dados.cliente_nome}`;
      document.getElementById("subtitulo").textContent = `${dados.origem} → ${dados.destino} · saída ${new Date(dados.data_hora_saida).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}`;
      document.getElementById("cartoes-resumo").innerHTML = `
        <div class="cartao-resumo"><div class="titulo">${ROTULOS_STATUS[dados.status] || dados.status}</div><div class="desc">Status</div></div>
        <div class="cartao-resumo"><div class="titulo">${dados.distancia_percorrida_km.toFixed(1)} km</div><div class="desc">Distância percorrida</div></div>
      `;

      if (dados.trajeto.length) {
        document.getElementById("sem-posicao").classList.add("escondido");
        const pontos = dados.trajeto.map((p) => [p.latitude, p.longitude]);
        linha.setLatLngs(pontos);
        const ultimo = pontos[pontos.length - 1];
        if (marcador) marcador.setLatLng(ultimo);
        else marcador = L.marker(ultimo, { icon: iconeEmoji(dados.icone_mapa || "🚌") }).addTo(mapa);
        mapa.fitBounds(linha.getBounds(), { maxZoom: 15, padding: [20, 20] });
      }

      renderizarAvaliacao(dados);
    }

    let avaliacaoRenderizada = false;

    function renderizarAvaliacao(dados) {
      const area = document.getElementById("area-avaliacao");
      if (dados.status !== "concluido") {
        area.classList.add("escondido");
        return;
      }
      area.classList.remove("escondido");

      if (dados.ja_avaliado) {
        area.innerHTML = `<p style="margin:0">Obrigado por avaliar este fretamento!</p>`;
        avaliacaoRenderizada = false;
        return;
      }
      if (avaliacaoRenderizada) return; // não sobrescreve o formulário em uso durante o polling
      avaliacaoRenderizada = true;

      area.innerHTML = `
        <h3 style="margin-top:0">Como foi o fretamento?</h3>
        <div class="estrelas" id="estrelas-fretamento">
          ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="estrela" data-nota="${n}">★</button>`).join("")}
        </div>
        <textarea id="comentario-fretamento" rows="2" placeholder="Comentário (opcional)" style="width:100%;margin-top:10px;padding:9px 11px;border:1px solid var(--borda);border-radius:6px;font-family:inherit"></textarea>
        <div class="linha-acoes"><button type="button" id="btn-enviar-avaliacao-fretamento">Enviar avaliação</button></div>
      `;

      let notaEscolhida = 0;
      document.querySelectorAll("#estrelas-fretamento .estrela").forEach((estrela) => {
        estrela.addEventListener("click", () => {
          notaEscolhida = parseInt(estrela.dataset.nota, 10);
          document.querySelectorAll("#estrelas-fretamento .estrela").forEach((e) => {
            e.classList.toggle("ativa", parseInt(e.dataset.nota, 10) <= notaEscolhida);
          });
        });
      });

      document.getElementById("btn-enviar-avaliacao-fretamento").addEventListener("click", async () => {
        if (!notaEscolhida) {
          mostrarAlerta("Escolha uma nota de 1 a 5 estrelas.");
          return;
        }
        const comentario = document.getElementById("comentario-fretamento").value.trim();
        try {
          const resposta = await fetch(`/api/fretamentos/rastrear/${codigo}/avaliar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nota: notaEscolhida, comentario: comentario || null }),
          });
          if (!resposta.ok) {
            const erro = await resposta.json().catch(() => ({}));
            throw new Error(erro.detail || "Não foi possível enviar a avaliação.");
          }
          dados.ja_avaliado = true;
          renderizarAvaliacao(dados);
        } catch (erro) {
          mostrarAlerta(erro.message);
        }
      });
    }

    if (!codigo) {
      mostrarAlerta("Link de rastreio inválido.");
    } else {
      iniciarMapa();
      carregar().catch((e) => mostrarAlerta(e.message));
      setInterval(() => carregar().catch(() => {}), 15000);
    }
  </script>
</body>
</html>
